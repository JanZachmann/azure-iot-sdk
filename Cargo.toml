[package]
authors = ["omnect@conplement.de>"]
edition = "2024"
homepage = "www.omnect.io"
license = "MIT OR Apache-2.0"
name = "azure-iot-sdk"
readme = "README.md"
repository = "git@github.com:omnect/azure-iot-sdk.git"
version = "0.15.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.105"
azure-iot-sdk-sys = { git = "https://github.com/omnect/azure-iot-sdk-sys.git", tag = "0.7.0", default-features = false }
eis-utils = { git = "https://github.com/omnect/eis-utils.git", default-features = false, tag = "0.3.4", optional = true }
futures = { version = "0.3.34", default-features = false }
log = { version = "0.4.35", default-features = false }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", default-features = false, features = [
  "rt",
  "sync",
  "time",
] }
url = { version = "2.5.9", default-features = false }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[features]
# select either "module_client", "edge_client" or "device_client" functionality
default = []
device_client = []
module_client = ["eis-utils"]
edge_client = ["azure-iot-sdk-sys/edge_modules"]
